name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 构建发布物：sdist + wheel
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 给 hatch-vcs 等动态版本工具留余地（即便目前不用）

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF##*/}"          # v0.1.0
          TAG_VER="${TAG#v}"               # 0.1.0
          PKG_VER=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG_VER  pyproject=$PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag $TAG_VER does not match pyproject.toml version $PKG_VER"
            exit 1
          fi

      - name: Build distribution
        run: uv build

      - name: Verify metadata with twine
        run: uvx twine check --strict dist/*

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # 发布到 PyPI（OIDC trusted publishing，无 API token）
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proxyctl/
    permissions:
      id-token: write   # 必须：OIDC token for trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        # 不传 password / token：完全靠 OIDC + PyPI 的 trusted publisher 绑定

  # ──────────────────────────────────────────────────────────────────────
  # 创建 GitHub Release，附 dist 文件
  # ──────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${GITHUB_REF##*/}"          # v0.5.1
          VER="${TAG#v}"                   # 0.5.1
          python3 - <<PY
          import re, sys
          text = open("CHANGELOG.md").read()
          pat = re.compile(r"## \[" + re.escape("$VER") + r"\][^\n]*\n(.*?)(?=## \[)", re.S)
          m = pat.search(text)
          if not m:
              sys.stderr.write(f"::error::CHANGELOG.md 中没有 $VER 段（## [$VER] — ...）\n")
              sys.exit(1)
          open(".release-notes.md", "w").write(m.group(1).strip() + "\n")
          PY
          echo "──── release notes preview ────"
          head -30 .release-notes.md
          echo "..."

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .release-notes.md \
            dist/*
