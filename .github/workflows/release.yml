name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 构建发布物：sdist + wheel
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 给 hatch-vcs 等动态版本工具留余地（即便目前不用）

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF##*/}"          # v0.1.0
          TAG_VER="${TAG#v}"               # 0.1.0
          PKG_VER=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG_VER  pyproject=$PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag $TAG_VER does not match pyproject.toml version $PKG_VER"
            exit 1
          fi

      # 门禁 1（防 v0.5.1 类）：CHANGELOG.md 必须有对应版本段。
      # 抽不到 / 段太短 → fast-fail 在 PyPI 发布之前，避免 "PyPI 已发但
      # GitHub Release notes 空" 的尴尬历史重演。
      - name: Verify CHANGELOG.md has entry for this version
        run: |
          TAG="${GITHUB_REF##*/}"
          VER="${TAG#v}"
          python3 - <<PY
          import re, sys
          text = open("CHANGELOG.md").read()
          pat = re.compile(r"## \[" + re.escape("$VER") + r"\][^\n]*\n(.*?)(?=## \[)", re.S)
          m = pat.search(text)
          if not m:
              sys.stderr.write(
                  f"::error::CHANGELOG.md 中没有 $VER 段（## [$VER] — ...）。"
                  f"tag $TAG 推送前必须先在 CHANGELOG 写本版变更。\n")
              sys.exit(1)
          body = m.group(1).strip()
          if len(body) < 20:
              sys.stderr.write(
                  f"::error::CHANGELOG [$VER] 段只有 {len(body)} 字符，太短。"
                  f"补充内容后重新打 tag。\n")
              sys.exit(1)
          print(f"✓ CHANGELOG has [$VER] section: {len(body)} chars")
          PY

      # 门禁 2（防 v0.5.2 类）：tag commit 上的 release.yml 必须是新版
      # （含 "Extract release notes from CHANGELOG.md" 步骤）。
      # 常见原因：本地 rebase 后忘 `git tag -f` 重定位 tag，
      # 推上去的 tag 仍指向旧 base commit（旧 release.yml）。
      - name: Verify release.yml has CHANGELOG extraction step
        run: |
          if ! grep -q "Extract release notes from CHANGELOG.md" \
                  .github/workflows/release.yml; then
            TAG="${GITHUB_REF##*/}"
            cat <<MSG >&2
          ::error::tag $TAG 指向的 commit 上 release.yml 是旧版本
          （未含 'Extract release notes from CHANGELOG.md' 步骤）。
          通常是本地 rebase 后 tag 没跟着移到新 HEAD。修复：
            git tag -f $TAG <newer-commit-sha> && git push -f origin $TAG
          MSG
            exit 1
          fi

      - name: Build distribution
        run: uv build

      - name: Verify metadata with twine
        run: uvx twine check --strict dist/*

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # 发布到 PyPI（OIDC trusted publishing，无 API token）
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proxyctl/
    permissions:
      id-token: write   # 必须：OIDC token for trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        # 不传 password / token：完全靠 OIDC + PyPI 的 trusted publisher 绑定

  # ──────────────────────────────────────────────────────────────────────
  # 创建 GitHub Release，附 dist 文件
  # ──────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${GITHUB_REF##*/}"          # v0.5.1
          VER="${TAG#v}"                   # 0.5.1
          python3 - <<PY
          import re, sys
          text = open("CHANGELOG.md").read()
          pat = re.compile(r"## \[" + re.escape("$VER") + r"\][^\n]*\n(.*?)(?=## \[)", re.S)
          m = pat.search(text)
          if not m:
              sys.stderr.write(f"::error::CHANGELOG.md 中没有 $VER 段（## [$VER] — ...）\n")
              sys.exit(1)
          open(".release-notes.md", "w").write(m.group(1).strip() + "\n")
          PY
          echo "──── release notes preview ────"
          head -30 .release-notes.md
          echo "..."

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .release-notes.md \
            dist/*
