[project]
name = "proxyctl"
version = "0.5.11"
description = "Proxy configuration lifecycle management for macOS and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crhan", email = "crhan123@gmail.com" }]
keywords = ["proxy", "mihomo", "clash", "sing-box", "lifecycle", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/crhan/proxyctl"
Issues = "https://github.com/crhan/proxyctl/issues"
Changelog = "https://github.com/crhan/proxyctl/blob/main/CHANGELOG.md"
Repository = "https://github.com/crhan/proxyctl"

[project.scripts]
proxyctl = "proxyctl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxyctl"]

[tool.hatch.build.targets.sdist]
include = ["src/proxyctl", "README.md", "LICENSE", "pyproject.toml",
           "man/proxyctl.1"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["proxyctl"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
precision = 1
